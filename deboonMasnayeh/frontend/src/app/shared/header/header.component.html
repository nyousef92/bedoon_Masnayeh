<header class="w-full bg-white border-b border-border px-6 py-3 flex items-center justify-between">
  <div class="relative">
    <button (click)="routToHome()" class="relative inline-flex">
      <span class="material-icons text-primary text-[38px]">diamond</span>
      <span
        class="material-icons text-primary-dark absolute text-[16px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">auto_awesome</span>
    </button>
  </div>
  <div class="relative">

    <!-- Avatar button -->
    <button (click)="toggleDropdown($event)"
      class="w-9 h-9 rounded-full bg-primary text-white text-sm font-semibold flex items-center justify-center hover:bg-primary-dark transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
      aria-label="User menu" [attr.aria-expanded]="dropdownOpen()">
      {{ userInitials }}
    </button>

    <!-- Dropdown -->
    @if (dropdownOpen()) {
    <div class="absolute right-0 mt-2 w-44 bg-white rounded-lg shadow-lg border border-border overflow-hidden z-50"
      (click)="$event.stopPropagation()">
      <button (click)="routToProfile()"
        class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-text-primary hover:bg-background transition-colors">
        <span class="material-icons text-text-secondary">person</span>
        Profile
      </button>
      <button (click)="routToMyOffers()"
        class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-text-primary hover:bg-background transition-colors">
        <span class="material-icons text-text-secondary">storefront</span>
        My Offers
      </button>
      <div class="border-t border-border"></div>
      <button (click)="logout()"
        class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
        <span class="material-icons text-red-600">logout</span>
        Logout
      </button>
    </div>
    }

  </div>
</header>
